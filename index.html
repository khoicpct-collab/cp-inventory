<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho - CP Vietnam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .material-card { border-left: 4px solid #007bff; margin-bottom: 1rem; }
        .location-section { background: #f8f9fa; padding: 1rem; margin: 0.5rem 0; border-radius: 5px; }
        .transaction-row:hover { background-color: #f0f0f0; }
        .stats-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">
                <i class="fas fa-warehouse"></i> Quản Lý Kho Nguyên Liệu - CP Vietnam
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Thống kê nhanh -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5><i class="fas fa-boxes"></i> Tổng nguyên liệu</h5>
                        <h3 id="totalMaterials">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5><i class="fas fa-map-marker-alt"></i> Vị trí kho</h5>
                        <h3 id="totalLocations">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5><i class="fas fa-exchange-alt"></i> Giao dịch hôm nay</h5>
                        <h3 id="todayTransactions">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5><i class="fas fa-weight-hanging"></i> Tổng tồn kho</h5>
                        <h3 id="totalStock">0 kg</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form thêm giao dịch -->
        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                <h5><i class="fas fa-plus-circle"></i> Thêm giao dịch mới</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Nguyên liệu</label>
                        <select id="materialSelect" class="form-select">
                            <option value="">-- Chọn nguyên liệu --</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Vị trí</label>
                        <input type="text" id="locationCode" class="form-control" placeholder="C06, A09...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Nhập (Bao)</label>
                        <input type="number" id="receiveBags" class="form-control" value="0" min="0">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Nhập (Kg)</label>
                        <input type="number" id="receiveWeight" class="form-control" value="0" min="0" step="0.01">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Mã NCC</label>
                        <input type="text" id="supplierCode" class="form-control" placeholder="10102122922">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Xuất (Bao)</label>
                        <input type="number" id="usageBags" class="form-control" value="0" min="0">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Xuất (Kg)</label>
                        <input type="number" id="usageWeight" class="form-control" value="0" min="0" step="0.01">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Số xe</label>
                        <input type="text" id="truckNumber" class="form-control">
                    </div>
                    <div class="col-md-12">
                        <button class="btn btn-success" onclick="addTransaction()">
                            <i class="fas fa-save"></i> Lưu giao dịch
                        </button>
                        <button class="btn btn-secondary" onclick="clearForm()">
                            <i class="fas fa-times"></i> Xóa form
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bộ lọc và tìm kiếm -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Tìm kiếm</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên, mã, vị trí...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Sắp xếp</label>
                        <select id="sortSelect" class="form-select">
                            <option value="name">Tên A-Z</option>
                            <option value="date">Ngày mới nhất</option>
                            <option value="location">Vị trí</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Lọc theo NCC</label>
                        <select id="supplierFilter" class="form-select">
                            <option value="">Tất cả NCC</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-outline-primary w-100" onclick="loadData()">
                            <i class="fas fa-sync-alt"></i> Làm mới
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hiển thị dữ liệu -->
        <div id="materialsContainer">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Đang tải...</span>
                </div>
                <p>Đang tải dữ liệu...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
