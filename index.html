<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Inventory Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QUẢN LÝ KHO NGUYÊN LIỆU</h1>
            <div class="header-actions">
                <button id="addTransactionBtn" class="btn-primary">+ Thêm giao dịch mới</button>
                <button id="refreshBtn" class="btn-secondary">🔄 Làm mới</button>
            </div>
        </header>

        <!-- Form thêm giao dịch -->
        <div id="transactionForm" class="form-modal" style="display: none;">
            <div class="form-content">
                <h2>Thêm giao dịch mới</h2>
                <form id="newTransactionForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ngày nhập *</label>
                            <input type="date" id="inputDate" required>
                        </div>
                        <div class="form-group">
                            <label>Tên nguyên liệu *</label>
                            <select id="materialName" required>
                                <option value="">Chọn nguyên liệu</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Vị trí kho *</label>
                            <select id="lockLocation" required>
                                <option value="">Chọn vị trí</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Nhập (Bao)</label>
                            <input type="number" id="importBags" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label>Nhập (Khối lượng)</label>
                            <input type="number" id="importWeight" min="0" value="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Sử dụng (Bao)</label>
                            <input type="number" id="usageBags" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label>Sử dụng (Khối lượng)</label>
                            <input type="number" id="usageWeight" min="0" value="0" step="0.01">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Code/NCC</label>
                            <input type="text" id="supplierCode">
                        </div>
                        <div class="form-group">
                            <label>Ngày công thức</label>
                            <input type="date" id="formulaDate">
                        </div>
                        <div class="form-group">
                            <label>Ngày sản xuất</label>
                            <input type="date" id="productionDate">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn-secondary">Hủy</button>
                        <button type="submit" class="btn-primary">Lưu giao dịch</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bộ lọc báo cáo -->
        <div class="report-filter">
            <h3>Xem báo cáo</h3>
            <div class="filter-controls">
                <select id="reportMaterial">
                    <option value="">Chọn nguyên liệu</option>
                </select>
                <input type="date" id="reportDate">
                <button id="generateReport" class="btn-primary">Xem báo cáo</button>
                <button id="showAll" class="btn-secondary">Hiển thị tất cả</button>
            </div>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="table-container">
            <table id="inventoryTable">
                <thead>
                    <tr>
                        <th>Ngày nhập</th>
                        <th>Tên nguyên liệu</th>
                        <th>Vị trí</th>
                        <th>Tồn đầu (Bao)</th>
                        <th>Tồn đầu (KL)</th>
                        <th>Nhập (Bao)</th>
                        <th>Nhập (KL)</th>
                        <th>Sử dụng (Bao)</th>
                        <th>Sử dụng (KL)</th>
                        <th>Tồn cuối (Bao)</th>
                        <th>Tồn cuối (KL)</th>
                        <th>Trung bình</th>
                        <th>Tuổi lưu kho</th>
                        <th>Code/NCC</th>
                        <th>Ngày công thức</th>
                        <th>Ngày sản xuất</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dữ liệu sẽ được thêm ở đây -->
                </tbody>
                <tfoot id="tableFooter">
                    <!-- Tổng hợp sẽ được thêm ở đây -->
                </tfoot>
            </table>
        </div>
    </div>

    <script src="data/materials.js"></script>
    <script src="data/locks.js"></script>
    <script src="script.js"></script>
</body>
</html>
